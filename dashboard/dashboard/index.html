<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose a WebSkin theme." />
    <title>WebSkin — Themes</title>
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="topbar">
        <a class="brand" href="/dashboard/" aria-label="WebSkin themes home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span>WebSkin</span>
        </a>
      </header>

      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Theme library</p>
          <h1 id="page-title">Choose your desktop</h1>
          <p class="heading-copy">Pick a theme to make WebSkin feel like yours.</p>
        </div>

        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 5 5"></path></svg>
          <input type="search" placeholder="Search themes" aria-label="Search themes" data-theme-search />
          <kbd>/</kbd>
        </label>
      </section>

      <section class="theme-section" aria-labelledby="themes-title">
        <div class="section-heading">
          <div class="section-title">
            <h2 id="themes-title">All themes</h2>
            <span class="theme-count" data-theme-count>Loading…</span>
          </div>
        </div>

        <p class="theme-status" data-theme-status role="status" aria-live="polite">Loading themes…</p>
        <div class="theme-grid" data-theme-grid></div>
      </section>
    </main>

    <script type="module" src="../src/dashboard.ts"></script>
  </body>
</html>
