<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dev widget gallery</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="dev-theme">
      <h1>dev widget gallery</h1>

      <nav class="showcase-pagination" aria-label="Widget gallery pages">
        <button type="button" data-showcase-previous aria-label="Show previous page" disabled>Previous</button>
        <button type="button" data-showcase-page="clocks" aria-controls="showcase-page-clocks" aria-current="page">Clocks</button>
        <button type="button" data-showcase-page="calendars" aria-controls="showcase-page-calendars">Calendars</button>
        <button type="button" data-showcase-page="system" aria-controls="showcase-page-system">System</button>
        <button type="button" data-showcase-page="mond" aria-controls="showcase-page-mond">Mond</button>
        <span data-showcase-status aria-live="polite">Page 1 of 4</span>
        <button type="button" data-showcase-next aria-label="Show next page">Next</button>
      </nav>

      <div id="showcase-page-clocks" class="showcase-page" data-showcase-panel="clocks" aria-label="Clock widgets" aria-hidden="false">
        <h2>Clocks</h2>
        <div id="clock-gallery" class="widget-list"></div>
      </div>

      <div id="showcase-page-calendars" class="showcase-page" data-showcase-panel="calendars" aria-label="Calendar widgets" aria-hidden="true" hidden>
        <h2>Calendars</h2>
        <div id="calendar-gallery" class="widget-list"></div>
      </div>

      <div id="showcase-page-system" class="showcase-page" data-showcase-panel="system" aria-label="System widgets" aria-hidden="true" hidden>
        <h2>System</h2>
        <div id="system-gallery"></div>
      </div>

      <div id="showcase-page-mond" class="showcase-page" data-showcase-panel="mond" aria-label="Mond widget" aria-hidden="true" hidden>
        <h2>Mond</h2>
        <div id="mond-gallery"></div>
      </div>
    </main>
    <script type="module" src="./pagination.js"></script>
    <script type="module" src="./script.js"></script>
    <script type="module" src="./system-page.js"></script>
    <script type="module" src="./mond-page.js"></script>
  </body>
</html>
